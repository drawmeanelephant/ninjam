name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev \
            libwayland-dev libwayland-bin wayland-protocols libxkbcommon-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  # zclient: the Zig client. Builds and runs its unit tests on both platforms;
  # live audio is compiled only where the backend is available (macOS), and
  # the fully static Linux binary is cross-built to prove it stays dep-free.
  zclient:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: zclient
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Unit tests
        run: zig build test --summary all

      - name: Build
        run: zig build -Doptimize=ReleaseSafe

      - name: Smoke-test the binary
        run: |
          ./zig-out/bin/zclient --help
          WAV=$(ls demo/evidence/*/sample-decoded-peer-1s.wav | head -1)
          ./zig-out/bin/zclient check-wav "$WAV" --min-rms 0.05

      - name: Static musl build
        if: runner.os == 'Linux'
        run: |
          zig build -Dtarget=x86_64-linux-musl -Doptimize=ReleaseSafe -Dlive=false --prefix zig-out-musl
          file zig-out-musl/bin/zclient
          file zig-out-musl/bin/zclient | grep -q 'statically linked'
