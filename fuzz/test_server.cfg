# NINJAM server config used by the fuzzer's wire-level replay tests.
# Deliberately permissive (anonymous access) so replayed post-auth traffic
# reaches the same code paths the in-process harness fuzzes.

AnonymousUsers yes
AnonymousUsersCanChat yes
AnonymousMaskIP no
MaxUsers 8
MaxChannels 4 4
DefaultBPM 120
DefaultBPI 16
